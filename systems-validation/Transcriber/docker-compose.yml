services:
  whisper:
    build:
      context: ./whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - whisper-model-cache:/root/.cache/huggingface
      - whisper-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_KEY: ${API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      TEMP_FILE_TTL_HOURS: ${TEMP_FILE_TTL_HOURS:-24}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-168}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000}
      WHISPER_REQUEST_TIMEOUT_MS: ${WHISPER_REQUEST_TIMEOUT_MS:-0}
    volumes:
      - api-data:/data
    depends_on:
      whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  whisper-model-cache:
  api-data:
  whisper-data:
