services:
  core:
    build: ./insight-core
    env_file:
      - ./insight-core/.env
    ports: ["4000:4000"]
    command: sh -c "npm run migrate:up && npm start"
    depends_on: [db]
    networks:
      - insight

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - insight

  whisper:
    build: ./whisper
    ports: ["8001:8000"]
    networks:
      - insight

  embeddings:
    build: ./embeddings
    ports: ["8002:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN}
    networks:
      - insight

  diarization:
    build: ./diarization
    ports: ["8003:8000"]
    environment:
      DIARIZATION_MODEL_NAME: pyannote/speaker-diarization-community-1
      DIARIZATION_DEVICE: cpu
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hfcache:/root/.cache/huggingface
    networks:
      - insight

  baseline:
    build: ./baseline
    env_file:
      - ./baseline/.env
    ports: ["8004:8000"]
    volumes:
      - ./insight-core/schemas:/schemas:ro
      # p1 training data (built by convert_abcd.py --train-out); when absent, training
      # falls back to the bundled fixtures
      - ./evaluation/data/abcd-train:/train:ro
    networks:
      - insight

  ollama:
    build: ./ollama
    ports: ["11434:11434"]
    environment:
      # pinned so p3's whole-conversation prompts are not silently truncated
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama:/root/.ollama
    networks:
      - insight

  web:
    env_file:
      - ./insight-web/.env
    build: ./insight-web
    ports: ["3000:3000"]

volumes:
  ollama:
  pgdata:
  hfcache:

networks:
  insight:
    name: insight-network
    driver: bridge
