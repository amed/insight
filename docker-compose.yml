services:
  # core:
  #   build: ./insight-core
  #   ports: ["4000:4000"]
  #   environment:
  #     DATABASE_URL: postgres://insight:insight@db:5432/insight
  #     PORT: 4000
  #     NODE_ENV: development
  #     # model service urls
  #     WHISPER_URL: http://whisper:8000
  #     EMBEDDINGS_URL: http://embeddings:8000
  #     DIARIZATION_URL: http://diarization:8000
  #     LLM_BASE_URL: http://ollama:11434/v1
  #     LLM_MODEL: llama3.1
  #   depends_on: [db]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  whisper:
    build: ./whisper
    ports: ["8001:8000"]

  embeddings:
    build: ./embeddings
    ports: ["8002:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN}

  diarization:
    build: ./diarization
    ports: ["8003:8000"]
    environment:
      DIARIZATION_MODEL_NAME: pyannote/speaker-diarization-community-1
      DIARIZATION_DEVICE: cpu
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hfcache:/root/.cache/huggingface

  ollama:
    build: ./ollama
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

  # web:
  #   build: ./insight-web
  #   ports: ["3000:3000"]

volumes:
  ollama:
  pgdata:
  hfcache: