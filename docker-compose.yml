services:
  core:
    build: ./insight-core
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://insight:insight@db:5432/insight
      PORT: 4000
      NODE_ENV: development
      # model service URLs, wired into processing later
      WHISPER_URL: http://whisper:4000
      EMBEDDINGS_URL: http://embeddings:4000
      LLM_BASE_URL: http://ollama:11434/v1
    depends_on: [db]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  whisper:
    build: ./whisper
    ports: ["8001:4000"]

  embeddings:
    build: ./embeddings
    ports: ["8002:4000"]

  ollama:
    build: ./ollama
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
  pgdata: